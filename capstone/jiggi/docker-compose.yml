version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vortex-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vortex_lounge
    ports:
      - "3306:3306"
    volumes:
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/02_routines_triggers.sql:/docker-entrypoint-initdb.d/02_routines_triggers.sql
      - ./database/03_reports_views.sql:/docker-entrypoint-initdb.d/03_reports_views.sql
      - ./database/04_seed.sql:/docker-entrypoint-initdb.d/04_seed.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vortex-api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: vortex_lounge
      DB_SSL: "false"
      JWT_SECRET: vortex_lounge_super_secure_jwt_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vortex-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mysql_data:
